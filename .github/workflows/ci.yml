name: lab3
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - run: |
          IMAGE=us-central1-docker.pkg.dev/project-52e97659-d51c-48c9-b06/lab3/lab3-app:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: read
        id-token: write
      steps:
        - uses: actions/checkout@v4

        - uses: google-github-actions/auth@v2
          with:
            workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
            service_account: ${{ secrets.GCP_SA_DEPLOYER }}

        - uses: google-github-actions/setup-gcloud@v2
                with:
                  install_components: gke-gcloud-auth-plugin

        - name: credentials del cluster
          run: |
            gcloud container clusters get-credentials lab2-gke \
              --zone=us-central1-a \
              --project=project-52e97659-d51c-48c9-b06

        - name: aplicar el SHA de este push
          run: |
            sed "s/IMAGE_TAG/${{ github.sha }}/" k8s/deploy.yaml | kubectl apply -f -

        - name: esperar a que el rollout termine
          run: kubectl rollout status deployment/lab3-app --timeout=180s
